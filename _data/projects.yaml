- title: CompassX
  subtitle: Promoting Metacognition with Web-based Learning Platform
  group: featured
  image: images/background.jpg
  # link: https://github.com/
  description: 
    A web-based data-driven learning platform designed to 
    promote students’ metacognitive skills in computing courses. 
    It integrates planning, self-monitoring, 
    and reflection into programming assignments to support self-regulated learning.

  repo: greenelab/lab-website-template
  tags:
    # - resource


- title: ClearMind
  subtitle: Evidence-based Psychological Intervention to Address Procrastination
  group: featured
  image: images/background.jpg
  # link: https://github.com/
  description: 
    ClearMind is a mobile application grounded in behavioral and psychological principles (ACT) 
    to help students manage and overcome academic procrastination. 
    It explores how evidence-based content and interactive activities 
    can help students learn, reflect, and grow at your own pace.
  repo: greenelab/lab-website-template
  tags:
    # - resource


- title: Exploring the Impact of Student-Instructor Interactions in Computing Courses
  # subtitle: a subtitle
  group: featured
  image: images/background.jpg
  # link: https://github.com/
  description: 
    This project examines how generative AI, including large language models (LLMs), 
    is reshaping student–instructor interactions in computing education. 
    It aims to inform the design of human-centered AI systems that better support teaching and learning.
  repo: greenelab/lab-website-template





